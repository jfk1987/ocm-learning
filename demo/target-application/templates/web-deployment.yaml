apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "target-application.name" . }}-web
  labels:
    {{- include "target-application.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "target-application.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "target-application.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      initContainers:
        - name: wait-for-redis
          image: {{ .Values.images.toolbox.reference | quote }}
          imagePullPolicy: Always
          command: ["sh", "-c", "until nc -z target-application-redis 6379; do sleep 2; done"]
          resources: {{- toYaml .Values.resources | nindent 12 }}
      containers:
        - name: web
          image: {{ .Values.images.web.reference | quote }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "target-application.name" . }}-nginx
