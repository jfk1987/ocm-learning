apiVersion: v1
kind: Service
metadata:
  name: {{ include "target-application.name" . }}-redis
  labels:
    {{- include "target-application.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "target-application.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis

