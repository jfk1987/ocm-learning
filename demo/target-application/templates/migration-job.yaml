apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "target-application.name" . }}-migration-{{ .Release.Revision }}
  labels:
    {{- include "target-application.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "target-application.name" . }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: {{ .Values.images.toolbox.reference | quote }}
          imagePullPolicy: Always
          command: ["sh", "-c", "echo 'Schema migration for release {{ .Release.Revision }} completed'"]
          resources: {{- toYaml .Values.resources | nindent 12 }}
