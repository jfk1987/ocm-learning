apiVersion: v1
kind: Pod
metadata:
  name: {{ include "target-application.name" . }}-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: {{ .Values.images.toolbox.reference | quote }}
      imagePullPolicy: Always
      command: ["sh", "-c", "wget -qO- http://target-application-web/healthz | grep -q ok"]
