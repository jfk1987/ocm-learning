# Template. The executable lockfile is generated by
# scripts/prepare-target-application.sh in the target-application repository.
schemaVersion: 1
component:
  name: example.org/team/target-application
  version: 0.1.0
  provider: example.org
  labels:
    - name: purpose
      value: ocm-learning
      signing: true
source:
  name: application-source
  type: git
  version: 0.1.0
  repository: http://forgejo.ocm.test:8080/ocm-admin/target-application.git
  ref: refs/tags/0.1.0
charts:
  - resourceName: helm-chart
    name: target-application
    source: local://app
    version: 0.1.0
    digest: REPLACE_WITH_SHA256
    path: target-application-chart.tgz
values:
  resourceName: deployment-values
  path: values-airgap.yaml
images:
  - name: web-image
    version: 1.27.4-alpine
    imageReference: public.ecr.aws/docker/library/nginx:1.27.4-alpine@sha256:REPLACE_WITH_64_HEX_DIGEST
    platform:
      os: linux
      architecture: amd64
  - name: redis-image
    version: 7.4.2-alpine
    imageReference: public.ecr.aws/docker/library/redis:7.4.2-alpine@sha256:REPLACE_WITH_64_HEX_DIGEST
    platform:
      os: linux
      architecture: amd64
  - name: toolbox-image
    version: 1.37.0
    imageReference: public.ecr.aws/docker/library/busybox:1.37.0@sha256:REPLACE_WITH_64_HEX_DIGEST
    platform:
      os: linux
      architecture: amd64
additionalResources:
  - name: source-archive
    type: sourceArchive
    inputType: Dir/v1
    path: source
