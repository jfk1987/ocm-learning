# Woodpecker 3.16 / Chart 3.6.5, deliberately small for the learning lab.
agent:
  replicaCount: 1
  persistence:
    enabled: false
  env:
    WOODPECKER_BACKEND: kubernetes
    # In the lab, the agent and short-lived pipeline pods remain in one namespace.
    # This lets the namespaced Role generated by the chart work without additional permissions.
    WOODPECKER_BACKEND_K8S_NAMESPACE: woodpecker
    WOODPECKER_BACKEND_K8S_STORAGE_RWX: false
    # A self-contained CTF includes all image layers. 8 GiB prevent the final run
    # from failing in a tight 2-GiB workspace.
    WOODPECKER_BACKEND_K8S_VOLUME_SIZE: 8G
    WOODPECKER_MAX_WORKFLOWS: "1"
  serviceAccount:
    create: true
    rbac:
      create: true

server:
  statefulSet:
    replicaCount: 1
  persistentVolume:
    enabled: true
    size: 2Gi
  env:
    WOODPECKER_HOST: http://woodpecker.ocm.test:8080
    WOODPECKER_FORGEJO: "true"
    WOODPECKER_FORGEJO_URL: http://forgejo.ocm.test:8080
    WOODPECKER_ADMIN: ocm-admin
    # Forgejo itself does not allow public registration. In the single-user lab,
    # the existing Forgejo user may sign in.
    WOODPECKER_OPEN: "true"
  extraSecretNamesForEnvFrom:
    - woodpecker-forgejo
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: woodpecker.ocm.test
        paths:
          - path: /
            backend:
              serviceName: woodpecker-server
              servicePort: 80
