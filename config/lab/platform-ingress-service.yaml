# The k3d load balancer exposes Traefik on host port 8080.
# This second Service address also exposes the same port inside the
# cluster. This makes the public OAuth URLs reachable from pods.
apiVersion: v1
kind: Service
metadata:
  name: lab-ingress
  namespace: kube-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: traefik-kube-system
    app.kubernetes.io/name: traefik
  ports:
    - name: web-lab
      protocol: TCP
      port: 8080
      targetPort: web
