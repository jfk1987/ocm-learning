# Diese Datei wird beim Erzeugen des k3d-Clusters nach
# /etc/rancher/k3s/registries.yaml kopiert.
#
# Der Host arbeitet mit localhost:5000. Innerhalb des Docker-Netzes ist die
# Registry dagegen über ihren k3d-Containernamen erreichbar. Der Mirror hält
# die Image-Referenz in Helm Values und Kubernetes-Manifests trotzdem gleich.
mirrors:
  "localhost:5000":
    endpoint:
      - "http://k3d-registry.localhost:5000"
