# This file is copied to
# /etc/rancher/k3s/registries.yaml when the k3d cluster is created.
#
# The host uses localhost:5000. Within the Docker network, the registry is
# reachable through its k3d container name. The mirror keeps the image
# reference identical in Helm values and Kubernetes manifests.
mirrors:
  "localhost:5000":
    endpoint:
      - "http://k3d-registry.localhost:5000"
