# Deliberately small single instance for the local learning lab.
replicaCount: 1

persistence:
  enabled: true
  size: 5Gi

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: forgejo.ocm.test
      paths:
        - path: /
          pathType: Prefix
          port: http

gitea:
  admin:
    existingSecret: forgejo-admin
    # The Secret initializes the account only on the first start. Afterwards, the
    # password is managed in Forgejo and is not overwritten by every Helm upgrade.
    passwordMode: initialOnlyRequireReset
  config:
    database:
      DB_TYPE: sqlite3
    server:
      DOMAIN: forgejo.ocm.test
      ROOT_URL: http://forgejo.ocm.test:8080/
      SSH_DOMAIN: forgejo.ocm.test
    service:
      DISABLE_REGISTRATION: true
    webhook:
      # Required in Lab 03 for communication with Woodpecker.
      ALLOWED_HOST_LIST: external,loopback,private
