apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocm-controller-demo
  namespace: default
  labels:
    app.kubernetes.io/name: ocm-controller-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ocm-controller-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocm-controller-demo
    spec:
      containers:
        - name: web
          image: localhost:5000/lab/alpine:3.21
          command: ["sh", "-c", "while true; do echo OCM controller demo; sleep 30; done"]
