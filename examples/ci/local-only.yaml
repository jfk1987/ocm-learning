# Nach .woodpecker/local-only.yaml im Forgejo-Repository kopieren.
# Das Image muss als Resource in platform.lock.yaml stehen und in Zot liegen.
when:
  - event: push
    branch: main

steps:
  verify-offline-toolchain:
    image: registry.airgap.example:5000/ci/alpine:REPLACE_WITH_DIGEST_OR_TAG
    commands:
      - git --version
      - test -f README.md
      - echo 'Build lief vollständig mit einem lokalen CI-Image.'
