# Store this file as .woodpecker/ocm-delivery.yaml in target-application.
# The tool image is built in Lab 04 and pushed to the local registry.
when:
  - event: tag

steps:
  - name: validate-release-inputs
    image: localhost:5000/lab/ocm-delivery:0.1.0
    pull: true
    commands:
      - ocm version
      - helm version --short
      - yq --version
      - skopeo --version
      - test -f config/application.lock.yaml
      - test -f delivery/target-application/target-application-chart.tgz
      - test -f delivery/target-application/values-airgap.yaml
      - diff -r app delivery/target-application/source
      - test "$CI_COMMIT_TAG" = "$(yq -r '.component.version' config/application.lock.yaml)"
      - skopeo list-tags --tls-verify=false docker://k3d-registry.localhost:5000/lab/alpine

  - name: deliver-ocm-component
    image: localhost:5000/lab/ocm-delivery:0.1.0
    pull: true
    environment:
      DELIVERY_DIR: delivery/target-application
      # Inside a pipeline pod, localhost refers to the pod itself. The k3d registry
      # is reachable through its container name. http:// prevents OCM from using
      # HTTPS with the deliberately TLS-free lab registry.
      OCM_REPOSITORY: http://k3d-registry.localhost:5000/ocm
    commands:
      - ./scripts/deliver-application.sh config/application.lock.yaml "$DELIVERY_DIR" "$OCM_REPOSITORY"
