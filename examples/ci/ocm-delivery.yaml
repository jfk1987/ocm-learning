# Diese Datei als .woodpecker/ocm-delivery.yaml in target-application ablegen.
# Das Toolimage wird in Lab 04 gebaut und in die lokale Registry gepusht.
when:
  - event: tag

steps:
  - name: release-eingaben-pruefen
    image: localhost:5000/lab/ocm-delivery:0.1.0
    pull: true
    commands:
      - ocm version
      - helm version --short
      - yq --version
      - skopeo --version
      - test -f config/application.lock.yaml
      - test -f delivery/target-application/target-application-chart.tgz
      - test -f delivery/target-application/values-airgap.yaml
      - test "$CI_COMMIT_TAG" = "$(yq -r '.component.version' config/application.lock.yaml)"
      - skopeo list-tags --tls-verify=false docker://k3d-registry.localhost:5000/lab/alpine

  - name: ocm-komponente-liefern
    image: localhost:5000/lab/ocm-delivery:0.1.0
    pull: true
    environment:
      DELIVERY_DIR: delivery/target-application
      # Aus einem Pipeline-Pod ist localhost der Pod selbst. Die k3d-Registry
      # ist über ihren Containernamen erreichbar. http:// verhindert, dass OCM
      # gegen die bewusst TLS-lose Lab-Registry HTTPS verwendet.
      OCM_REPOSITORY: http://k3d-registry.localhost:5000/ocm
    commands:
      - ./scripts/deliver-application.sh config/application.lock.yaml "$DELIVERY_DIR" "$OCM_REPOSITORY"
